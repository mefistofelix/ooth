name: ci
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish prerelease binaries after the build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve repository line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Delegate a cgroup for Linux integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          group=/sys/fs/cgroup/ooth-ci
          sudo mkdir "$group"
          sudo chown "$(id -u):$(id -g)" "$group" "$group/cgroup.procs" "$group/cgroup.threads" "$group/cgroup.subtree_control"
          echo "OOTH_CGROUP_ROOT=$group" >> "$GITHUB_ENV"
      - shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo sh -c 'echo "$1" > "$2/cgroup.procs"' _ "$$" "$OOTH_CGROUP_ROOT"
          fi
          export OOTH_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          bash ./build.sh
      - name: Remove the Linux test cgroup
        if: always() && runner.os == 'Linux'
        shell: bash
        run: sudo rmdir /sys/fs/cgroup/ooth-ci
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: |
            bin/ooth-*
            bin/README.md

  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd bin
          sha256sum ooth-* > SHA256SUMS
          tag="${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ooth-* SHA256SUMS README.md --clobber
          else
            gh release create "$tag" ooth-* SHA256SUMS README.md --target "$GITHUB_SHA" --title "ooth $tag" --notes 'Experimental Linux and Windows builds. See README for worker conventions and platform limitations.' --prerelease
          fi
